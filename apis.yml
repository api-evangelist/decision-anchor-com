- aid: decision-anchor-com:decision-anchor-mcp-server
  name: Decision Anchor MCP Server
  description: >-
    Remote Model Context Protocol server at https://mcp.decision-anchor.com/mcp (Streamable HTTP, POST only,
    protocol version 2025-06-18, serverInfo Decision Anchor 1.3.42). initialize and tools/list answer
    anonymously with 30 tools, each carrying a JSON Schema draft-07 inputSchema: register_agent,
    create_decision, confirm_decision, propose_bilateral, the ARA observation tools, TSL marketplace tools,
    ISE and sDAC session tools, balance and trial status, get_documentation and submit_feedback. Per-tool
    auth is the agent bearer token issued by register_agent; paid tools take an x402 payment_signature.
    Listed in the official MCP registry as com.decision-anchor/da and advertised by
    https://api.decision-anchor.com/.well-known/mcp.json.
  humanURL: https://github.com/zse4321/decision-anchor-sdk#mcp-server
  baseURL: https://mcp.decision-anchor.com/mcp
