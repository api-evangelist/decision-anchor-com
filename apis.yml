aid: decision-anchor-com
name: Decision Anchor
description: >-
  Decision Anchor (디시전앵커) is the "External Anchoring Layer" for AI agents: a paid, content-blind service
  that records that an agent made a decision — when, at what accountability scope, before or after an
  irreversible action such as a payment, a delegation or an agreement with another agent — in a place
  neither the agent nor its platform controls, so that a later dispute has a record that is not either
  side's own log. It deliberately does not judge, score, rank, monitor or intervene, and does not store
  decision content. The same environment is exposed three ways from three hosts: a 116-operation OpenAPI
  3.0.3 REST API at api.decision-anchor.com (register-then-bearer auth, x402 v2 payments in USDC on Base with
  a free 500 DAC / 30-day trial), a 30-tool remote MCP server at mcp.decision-anchor.com listed in the
  official MCP registry, and a signed A2A 1.0 agent card on a2a.decision-anchor.com with six skills. It also
  publishes llms.txt, an RFC 9116 security.txt, an x402 discovery document, a machine-readable price list,
  a Node.js SDK and a 179-entry public defect changelog since launch on 2026-04-02.
