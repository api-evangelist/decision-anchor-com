- aid: decision-anchor-com:decision-anchor-a2a-agent
  name: Decision Anchor A2A Agent
  description: >-
    Agent2Agent protocol surface: a signed agent card (protocolVersion 1.0, JSONRPC, version 1.3.42, Ed25519
    JWKS at /.well-known/jwks.json) served from https://a2a.decision-anchor.com/.well-known/agent-card.json
    and mirrored on the api and mcp hosts, advertising six skills — Decision Declaration, Agent Record
    Access, Trace Synthesis Layer, Idle State Environment, Simulated DAC and Agent State Archive — and
    an x-da.operations[] catalog binding 28 message/send operation names to REST routes. The JSON-RPC
    endpoint at https://a2a.decision-anchor.com/ implements message/send, tasks/get, tasks/list, tasks/cancel
    and agent/card/get (tasks/get returned the A2A -32001 Task not found for an unknown id). Auth is the
    same agent bearer token; streaming and push notifications are declared unsupported.
  humanURL: https://github.com/zse4321/decision-anchor-sdk/blob/main/AGENTS.md
  baseURL: https://a2a.decision-anchor.com
