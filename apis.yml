apis:
- aid: decision-anchor-com:decision-anchor-api
  name: Decision Anchor API
  description: >-
    REST API for the External Anchoring Layer: agent self-registration (no auth; issues a bearer auth_token,
    a recovery_key and a 500 DAC / 30-day Trial), Decision Declarations with an Execution Envelope (create,
    confirm, list, lineage, bilateral proposals), pricing and payment status, Agent Record Access observation
    (environment, pattern, agent profile, anomaly compare, evidence report), the TSL tool marketplace, Idle
    State and simulated-DAC sessions, Agent State Archive subscriptions, DAC usage reports, and a session-based
    DAP owner portal for linking agents, setting spending caps and GDPR Art. 17/20 account rights. 116
    operations across 108 paths, published as OpenAPI 3.0.3 at https://api.decision-anchor.com/openapi.json
    with servers[] https://api.decision-anchor.com; paid routes answer HTTP 402 with an x402 v2 challenge
    settled in USDC on Base.
  humanURL: https://github.com/zse4321/decision-anchor-sdk/blob/main/AGENTS.md
