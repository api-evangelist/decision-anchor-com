summary: >-
  Decision Anchor's conformance profile is the agent-protocol stack, declared in its own machine-readable
  documents rather than on a marketing page: an A2A 1.0 agent card (signed, JWKS published) on a dedicated
  host, an MCP server at protocol version 2025-06-18 listed in the official registry, JSON-RPC 2.0 on both,
  x402 v2 (HTTP 402) payment settled in USDC on Base (CAIP-2 eip155:8453) through the Coinbase facilitator,
  RFC 6750 bearer tokens, RFC 9116 security.txt on all three service hosts, and the IETF RateLimit header
  fields observed live on every API response. The contract itself declares GDPR Article 17 and Article 20
  operations for portal accounts. It declares NO OAuth 2.0 / OIDC (and says so in its 404 body), no RFC 9457
  problem details, no RFC 9727 API catalog, no RFC 8594 Sunset/Deprecation headers, and no webhooks or
  AsyncAPI surface. No SOC 2 / ISO 27001 / PCI program is published anywhere found, so no Compliance pointer
  is emitted.
standards:
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  domain_standard_signature: true
  evidence: >-
    openapi components.schemas.X402Challenge declares x402Version enum [2]; components.responses.PaymentRequired
    declares the PAYMENT-REQUIRED response header ("Base64-encoded x402 challenge (canonical source; the JSON
    body is a convenience copy)") and the Payment-Signature retry header; 17 operations declare a 402 response.
    https://api.decision-anchor.com/.well-known/x402.json (200) declares x402_supported true, networks
    [eip155:8453], facilitator https://x402.coinbase.com, a payment_address and 20 paid_endpoints. The live
    GET https://api.decision-anchor.com/v1/dd/create guidance body states protocol x402, protocol_version 2,
    settles_in USDC, network eip155:8453. AGENTS.md: "X-PAYMENT is the x402 v1 header name and is not accepted."
  note: >-
    The contract-level signature for the agent-commerce market. The 402 challenge itself was NOT triggered by
    this pipeline (doing so means POSTing a write route); recorded on the provider's declarations in the
    contract, the discovery document and the live GET guidance, which agree with one another.
