summary:
  hosts_probed: 6
  paths_probed: 88
  documents_served: 11
  hit_count: 11
  note: >-
    Decision Anchor concentrates its machine-readable surface on the three service hosts and serves nothing
    under /.well-known/ on the apex or the microsites. The api, mcp and a2a hosts each serve an RFC 9116
    security.txt (Contact, Expires, Preferred-Languages, Canonical; no Policy line), an A2A agent card at both
    the canonical and the legacy path, and an MCP discovery document at /.well-known/mcp.json — the api host's
    is the real server card (id com.decision-anchor/da, endpoint, transport, registry), the mcp and a2a hosts'
    are pointer documents that name the api host as canonical. The api host additionally serves an x402
    payment-discovery document at /.well-known/x402.json and the a2a host a JWKS with the Ed25519 key that
    signs the agent card. No OAuth/OIDC discovery anywhere: the API's own 404 body states "Decision Anchor
    does not use OAuth-based authorization discovery. To interact: register for a bearer token", so the
    RFC 8414 / RFC 9728 misses on the MCP host describe the auth model accurately rather than an omission. No
    RFC 9727 api-catalog, no APIs.json, no ai-plugin, no UCP/ACP/AAuth manifests. The apex 404 is a real HTML
    404 page (title "404: Decision Anchor", 773 bytes) and the service hosts' 404 is a JSON error body, so a
    200 on any of these hosts is a served document, not a catch-all.
