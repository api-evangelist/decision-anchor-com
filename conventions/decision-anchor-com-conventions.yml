payments:
  protocol: x402 v2 (HTTP 402)
  challenge_header: PAYMENT-REQUIRED (base64; body is a copy)
  retry_header: Payment-Signature (X-PAYMENT, the v1 name, is rejected as unpaid)
  asset: USDC on Base (eip155:8453) via the Coinbase facilitator
  discovery: https://api.decision-anchor.com/.well-known/x402.json
  balances: 'Trial (500 DAC / 30 days, three routes only), External (USDC per call, capped by owner-set DAB), Earned (TSL revenue; internal-only, min_spend 30, 365-day expiry)'
  detail: plans/decision-anchor-com-plans-pricing.yml
webhooks:
  supported: false
  note: No callbacks, webhooks or event stream anywhere; A2A pushNotifications false. The MCP registry entry and the SDK topics both say mcp-server, not events.
other_conventions:
  - name: Case
    detail: 'Every enum is lowercase EXCEPT selection_state (SELECTED/REJECTED/ABORTED/SILENT/NON_DECISION) — "the only one of seventeen that uses uppercase notation" (changelog 2026-08-29).'
  - name: GET on a POST route
    detail: Returns a guidance document (how_to_call, curl_example, payment terms) rather than 405 — the routes teach their own use.
  - name: Undefined fields
    detail: Refused with 400 UNKNOWN_FIELD, never silently discarded.
  - name: Timestamps
    detail: ISO 8601; decision_at is normalised to UTC server-side and enters the integrity hash.
  - name: Identifiers
    detail: UUIDs for agent_id, dd_id, ee_id, session_id, tool_id, agreement_id; credential prefixes da_tk_ (auth token) and da_rk_ (recovery key).
  - name: Locale
    detail: 'Machine-readable surfaces are English; some human labels are Korean (ee-presets display_name "기본/표준/고책임"; the company signs as 디시전앵커). security.txt Preferred-Languages: en, ko.'
