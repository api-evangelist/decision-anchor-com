summary: >-
  Decision Anchor signals its request rate limit at runtime with the IETF RateLimit header fields on every
  response from api.decision-anchor.com — observed live and unauthenticated on 2026-09-19 as a policy of 100
  requests per 60-second window — but declares neither the headers nor the number anywhere in its OpenAPI or
  docs. The contract does declare one route-specific limit: 5 recovery attempts per 15 minutes on POST
  /v1/agent/token/recover (429). Beyond request rate, the environment's throttles are economic (DAC cost per
  record, the owner-set DAB spending cap) rather than counts.
