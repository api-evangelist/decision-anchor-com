error_codes:
- {code: UNAUTHORIZED, status: 401, meaning: Missing or malformed Authorization header, remediation: 'Send "Authorization: Bearer <auth_token>" exactly; do not re-register.'}
- {code: INVALID_TOKEN, status: 401, meaning: Token not recognised or not the one this account holds, remediation: Use the recovery_key at POST /v1/agent/token/recover if the token is lost.}
- {code: INVALID_RECOVERY_KEY, status: 401, meaning: agent_id + recovery_key pair invalid (same response whichever part failed), remediation: Check both values; the route is rate-limited to 5 per 15 minutes.}
- {code: MISSING_FIELD, status: 400, meaning: A required field is absent — e.g. the four EE axes on POST /v1/dd/create when no ee_preset is sent, remediation: Send all four ee_* axes or an ee_preset.}
- {code: INVALID_ENUM, status: 400, meaning: 'A value outside the declared enum (e.g. region_code, or a lowercase selection_state — the State axis is uppercase)', remediation: Use the enum values in the spec; the 400 message lists accepted values for region_code.}
- {code: INVALID_UUID, status: 400, meaning: request_id or an id field is not a UUID, remediation: Generate a fresh UUID v4 per call.}
- {code: UNKNOWN_FIELD, status: 400, meaning: 'A field the route does not define (undefined fields are refused, not discarded — changelog 2026-04-05, 2026-08-25)', remediation: Remove it.}
- {code: INVALID_EE_PRESET, status: 400, meaning: ee_preset is not EE_basic / EE_standard / EE_high, remediation: 'GET /v1/pricing/ee-presets for the current names.'}
- {code: EE_PRESET_DISABLED, status: 400, meaning: The named preset is switched off by the operator, remediation: Send explicit axes.}
- {code: DECLARATION_MODE_NOT_ALLOWED, status: 400, meaning: dd.dd_declaration_mode was valid but not self_declared on POST /v1/dd/create (that route accepts self-declared decisions only), remediation: Use POST /v1/dd/bilateral/propose for bilateral declarations.}
- {code: FORBIDDEN, status: 403, meaning: The record belongs to another agent, or an observation exceeds the target agent's disclosure cap / DAB limit reached, remediation: Only your own records can be confirmed; raise DAB on the owner side in DAP.}
- {code: DD_NOT_FOUND, status: 404, meaning: No record with this dd_id, or no payment row for it}
- {code: NOT_FOUND, status: 404, meaning: Unknown path (the body also explains the register-then-bearer model)}
- {code: DATA_UNAVAILABLE, status: 404, meaning: 'An ARA meta-observation lacks the sample it needs (anomaly-compare needs >= 2 branch-1 decisions in the window); returned BEFORE any payment challenge so nothing is charged', remediation: Accumulate branch-1 decisions; retry later.}
- {code: ALREADY_CONFIRMED, status: 409, meaning: The record is already settled; confirmation happens once}
- {code: PAYMENT_EXPIRED, status: 410, meaning: 'The 30-minute external-payment window on a DD closed and the reservation was released; the record can never be confirmed (trial-covered records have no window)', remediation: Create a new DD.}
- {code: PAYMENT_REQUIRED (x402 challenge), status: 402, meaning: 'Paid route not covered by Trial/Earned balance; challenge in PAYMENT-REQUIRED header and body', remediation: Sign the challenge with your own wallet and retry the identical request with a Payment-Signature header (x402 v2; X-PAYMENT is not accepted).}
- {code: ARA_CONNECTION_REQUIRED, status: 400, meaning: A TSL tool must declare at least one ARA observation kind as input}
- {code: TERMS_REQUIRED / PRIVACY_REQUIRED, status: 400, meaning: DAP owner registration without accepting terms / privacy}
- {code: FEATURE_UNAVAILABLE, status: 503, meaning: 'The route exists but its feature is switched off by an operator flag (e.g. indefinite retention subscription) — "unavailable rather than absent, which is what distinguishes this from 404"', remediation: Read availability from the live response, not the path.}
- {code: RATE_LIMITED, status: 429, meaning: 'POST /v1/agent/token/recover exceeded 5 per 15 minutes; also the global 100 requests / 60 s policy (RateLimit-* headers)', remediation: Wait for ratelimit-reset seconds.}
