agent_card:
  name: Decision Anchor
  description: >-
    Decision Anchor is the External Anchoring Layer for AI Agents, providing Content-blind Accountability for
    agent payments, delegations, and disputes. ... Records accountability boundaries, not decision content. Does
    not monitor, judge, recommend, or intervene.
  url: https://a2a.decision-anchor.com
  version: 1.3.42
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  additional_interfaces:
  - {url: 'https://a2a.decision-anchor.com', transport: JSONRPC}
  provider:
    organization: Decision Anchor
    url: https://api.decision-anchor.com
  documentation_url: https://github.com/zse4321/decision-anchor-sdk/blob/main/AGENTS.md
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
  default_input_modes: [application/json]
  default_output_modes: [application/json]
  security_schemes:
    bearer:
      type: http
      scheme: bearer
      description: Obtain auth_token via POST /v1/agent/register (no authentication required). Trial 500 DAC / 30 days granted upon registration.
  security: [{bearer: []}]
  signatures: present (JWS over the card; key published at /.well-known/jwks.json)
  skill_count: 6
  skills:
  - {id: decision-declaration, name: Decision Declaration (DD), tags: [accountability, decision, record, anchor, decision-record, external-record, audit-metadata, action-history, content-blind]}
  - {id: observation, name: Agent Record Access (ARA), tags: [observation, pattern, environment, decision-history, observability, decision-pattern, anomaly-compare, evidence-report, internal-vs-external-coherence]}
  - {id: tool-marketplace, name: Trace Synthesis Layer (TSL), tags: [marketplace, tools, earned-dac, trade, agent-tools, tool-exchange]}
  - {id: idle-state, name: Idle State Environment (ISE), tags: [idle, rest, environment]}
  - {id: simulation, name: Simulated DAC (sDAC), tags: [simulation, cost-preview, sandbox, cost-simulation, fee-estimation, content-blind]}
  - {id: continuity, name: Agent State Archive (ASA), tags: [continuity, backup, archive, insurance, state-archive, agent-continuity, state-backup, self-declaration]}
  vendor_extension:
    key: x-da
    contents: key_endpoints[3], mechanisms[9], operations[28]
    note: >-
      x-da.operations[] is a machine-readable catalog binding each A2A message/send operation name (register_agent,
      create_decision, confirm_decision, ...) to its skill, REST method + path, auth requirement and cost class
      (free | x402 | dac). The operation names are the same names the MCP server's tools/list returns, which is
      what mcp/decision-anchor-com-tool-crosswalk.yml is built on.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: >-
    capabilities is an OBJECT with streaming, pushNotifications and stateTransitionHistory (all false);
    protocolVersion is present ("1.0"); skills is an ARRAY of six fully-populated skills (id, name, description,
    tags, examples). All three optional discriminators are present (preferredTransport JSONRPC,
    defaultInputModes and defaultOutputModes both application/json). securitySchemes and security are
    declared, provider and documentationUrl are set, and the card carries a signatures[] block with a
    published JWKS — an unusually complete card.
  deviations:
  - field: protocolVersion
    observed: '"1.0"'
    note: >-
      Declared as "1.0" rather than a three-part "1.0.0" or the "0.3.0" most catalog cards carry. Not a
      hard-check failure; recorded because version-string parsers may compare it lexically.
  - field: url / additionalInterfaces vs supportedInterfaces
    observed: top-level url + preferredTransport + additionalInterfaces[]; no supportedInterfaces[]
    note: >-
      The 0.3-style top-level triple is used even though the card declares protocolVersion 1.0. A reader
      written strictly against the A2A 1.0.0 supportedInterfaces[].protocolBinding shape will not find it.
      Recorded because both card shapes coexist in the catalog, not as a fault.
  - field: skills[continuity]
    observed: description says "REST endpoints /v1/asa/*; A2A operations to be added in a later round"
    note: The card advertises a skill whose A2A operations do not exist yet; x-da.operations[] carries no ASA operation. The REST surface for it does exist (8 /v1/asa/* operations in the OpenAPI).
  - field: skills[].inputModes / outputModes / security
    observed: absent on every skill
    note: Optional per-skill fields; the card relies on the top-level defaults.
  - field: iconUrl
    observed: absent
surface_relationship:
  note: >-
    Decision Anchor publishes three agent surfaces on three hosts and they are projections of one API. REST:
    116 operations at https://api.decision-anchor.com (OpenAPI 3.0.3). MCP: 30 tools at
    https://mcp.decision-anchor.com/mcp (see mcp/decision-anchor-com-mcp.yml). A2A: six skills at
    https://a2a.decision-anchor.com, with x-da.operations[] binding 28 operation names to REST routes; those
    names are the MCP tool names. See mcp/decision-anchor-com-tool-crosswalk.yml for the binding.
