method: derived
source: >-
  Derived by aligning the live MCP tools/list (30 tools, mcp/decision-anchor-com-mcp-tools.json, fetched
  anonymously 2026-09-19) and the A2A card's x-da.operations[] catalog (28 operations, each naming its REST
  method + path) with the provider's OpenAPI 3.0.3 (openapi/decision-anchor-com-openapi.yml, 116 operations).
  The provider declares NO operationId on any operation, so REST bindings below are named by method + path,
  verbatim from the spec's paths. The provider's own x-da.operations[] supplied most bindings, which is why
  confidence is high on those rows.
purpose: >-
  Make the MCP tool the first-class discovery unit and bind it to its backing REST operation. Decision
  Anchor's REST, MCP and A2A surfaces are three transports over one adapter registry: the A2A operation names
  ARE the MCP tool names, and 27 of the 30 tools map onto REST routes. The REST contract is the superset
  (116 ops vs 30 tools) — the DAP owner portal (36 session-cookie routes), ASA, TSL revenue/transfer, DAB,
  payment status and DUR export exist only over REST.
surfaces:
  rest_openapi: openapi/decision-anchor-com-openapi.yml     # 108 paths / 116 operations; no operationIds; source verbatim in openapi/_original/
  mcp: https://mcp.decision-anchor.com/mcp                    # tools/list open (anonymous); 30 tools with inputSchema
  a2a: https://a2a.decision-anchor.com                        # JSON-RPC; 6 skills; x-da.operations[] binds 28 operation names to REST
  graphql: null

