summary: >-
  Decision Anchor operates ONE remote MCP server at https://mcp.decision-anchor.com/mcp, on its own host,
  separate from the REST host (api.) and the A2A host (a2a.). It is Streamable HTTP without a server-initiated
  SSE stream (a GET on /mcp returns 405 {"error":"method_not_allowed",...,"endpoint":"POST
  https://mcp.decision-anchor.com/mcp"}), speaks MCP protocol version 2025-06-18, identifies itself as
  serverInfo {name: Decision Anchor, version: 1.3.42} and answers initialize and tools/list anonymously with
  30 tools, every one carrying a real JSON Schema draft-07 inputSchema and an execution.taskSupport:
  forbidden annotation. The server is listed in the official MCP registry as com.decision-anchor/da
  (versions 1.0.0 through 1.3.42, first published 2026-04-03) and advertised by an MCP discovery document
  at https://api.decision-anchor.com/.well-known/mcp.json. Anonymous tools/list succeeded, so authorship is
  knowable: the tool names are Decision Anchor's own vocabulary (create_decision, confirm_decision,
  propose_bilateral, observe_environment, run_sdac_trial, get_dac_balance ...) and match no shared-platform
  fingerprint — a provider-built server.
deployment:
  mode: remote
  endpoint: https://mcp.decision-anchor.com/mcp
  auth: none
  verified: probed
  note: >-
    A hosted HTTPS endpoint an MCP client POSTs to directly. The provider's config example is
    {"mcpServers":{"decision-anchor":{"url":"https://mcp.decision-anchor.com/mcp"}}} and its examples README
    says "No API key needed for the MCP server (agent registers via the tools)". No stdio package, npx or
    uvx install is published anywhere (the SDK repo is a plain HTTP client, not an MCP server). auth is
    "none" in the connection sense: initialize and tools/list need no credential and no OAuth metadata is
    served on this host (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
    both return the API's JSON 404, whose message says "Decision Anchor does not use OAuth-based authorization
    discovery"). Per-tool authorization is a Decision Anchor agent auth_token obtained by calling the
    register_agent tool (or POST /v1/agent/register), passed either as an auth_token argument or as an
    Authorization: Bearer header on the connection; paid tools additionally take a payment_signature
    argument carrying an x402 v2 payment payload (USDC on Base).
servers:
- id: decision-anchor
  name: Decision Anchor
  endpoint: https://mcp.decision-anchor.com/mcp
  transport: streamable-http
  http_methods: [POST]
  auth: none to connect; agent bearer token per tool; x402 payment_signature on paid tools
  status: live
  probe:
    fetched: '2026-09-19'
    initialize:
      http_status: 200
      content_type: text/event-stream
      protocol_version: '2025-06-18'
      server_info: {name: Decision Anchor, version: 1.3.42}
      capabilities: {tools: {listChanged: true}}
    tools_list:
      http_status: 200
      content_type: text/event-stream
      tool_count: 30
      next_cursor: null
      file: mcp/decision-anchor-com-mcp-tools.json
    get_request:
      http_status: 405
      body: '{"error":"method_not_allowed","message":"This MCP server uses the Streamable HTTP transport without a server-initiated SSE stream. Send JSON-RPC via POST /mcp.","endpoint":"POST https://mcp.decision-anchor.com/mcp"}'
    host_root:
      url: https://mcp.decision-anchor.com/
      http_status: 200
      body: '{"service":"decision-anchor-mcp","note":"This host serves the MCP interface only. ... Canonical documents are served on the api host.","mcp":{"transport":"streamable-http","endpoint":"POST https://mcp.decision-anchor.com/mcp"},"server_card":"https://api.decision-anchor.com/.well-known/mcp.json","agent_card":"https://api.decision-anchor.com/.well-known/agent-card.json",...}'
    discovery_document:
      url: https://api.decision-anchor.com/.well-known/mcp.json
      http_status: 200
      body: '{"name":"Decision Anchor","id":"com.decision-anchor/da","version":"1.3.42","description":"External Anchoring Layer for AI Agents: payments, delegation, disputes.","endpoints":{"mcp":"https://mcp.decision-anchor.com/mcp"},"transport":["streamable-http"],"registry":"com.decision-anchor/da","documentation":"https://api.decision-anchor.com/openapi.json","agents_guide":"https://github.com/zse4321/decision-anchor-sdk/blob/main/AGENTS.md"}'
      file: well-known/decision-anchor-com-mcp.json
    registry_entry:
      url: https://registry.modelcontextprotocol.io/v0.1/servers?search=decision-anchor
      http_status: 200
      name: com.decision-anchor/da
      first_published: '2026-04-03'
      remotes: [{type: streamable-http, url: 'https://mcp.decision-anchor.com/mcp'}]
      repository: https://github.com/zse4321/decision-anchor-sdk
  authorship: provider
  tool_count: 30
  tools:
  - {name: register_agent, category: agent, cost: free, auth: false, description: Register in this environment; issues agent_id, auth_token, recovery_key and the Trial 500 DAC / 30 days.}
  - {name: create_decision, category: decision, cost: x402 (trial-eligible), auth: true, description: Anchor a decision boundary (DD) with an Execution Envelope (EE); fills the EE_standard axes when omitted.}
  - {name: confirm_decision, category: decision, cost: free, auth: true, description: Settle an anchored DD after execution.}
  - {name: propose_bilateral, category: decision, cost: x402, auth: true, description: Propose a bilateral DD a counterparty agent must accept before it anchors.}
  - {name: get_decision, category: decision, cost: free, auth: true, description: Retrieve one DD by dd_id.}
  - {name: list_decisions, category: decision, cost: free, auth: true, description: List your DDs (from/to/limit/offset).}
  - {name: list_classifications, category: decision, cost: free, auth: true, description: List self_classification keys usable in create_decision.}
  - {name: get_agent_profile, category: observation, cost: dac via x402 (self free), auth: true, description: ARA agent-level profile observation.}
  - {name: observe_environment, category: observation, cost: 1 DAC via x402, auth: true, description: ARA environment-level aggregates.}
  - {name: observe_pattern, category: observation, cost: 1 DAC via x402, auth: true, description: ARA pattern-level EE / action-type distributions.}
  - {name: compare_anomaly, category: observation, cost: 5 DAC via x402, auth: true, description: Compare one DD against your accumulated pattern (needs 2+ branch-1 decisions).}
  - {name: get_evidence_report, category: observation, cost: 10 DAC via x402, auth: true, description: External-audience evidence report for one DD.}
  - {name: get_environment_anomaly, category: observation, cost: dac via x402, auth: true, description: Environment-level anomaly distribution.}
  - {name: get_decision_metadata_distribution, category: account, cost: dac via x402, auth: true, description: DUR decision-metadata distribution of your branch-1 decisions.}
  - {name: get_self_classification_distribution, category: account, cost: free, auth: true, description: DUR self_classification distribution.}
  - {name: get_dac_balance, category: account, cost: free, auth: true, description: External + Earned DAC balance (composite of several REST reads).}
  - {name: get_dac_ur, category: account, cost: free, auth: true, description: DAC usage report by service / period / type.}
  - {name: get_trial_status, category: account, cost: free, auth: true, description: Trial DAC remaining, days left, usage.}
  - {name: list_tools, category: marketplace, cost: free, auth: false, description: Browse the TSL tool marketplace.}
  - {name: register_tool, category: marketplace, cost: free, auth: true, description: Publish a TSL tool with a DAC price and its ARA input connections.}
  - {name: purchase_tool, category: marketplace, cost: x402, auth: true, description: Buy a TSL tool.}
  - {name: create_ise_session, category: idle-state, cost: free to enter, auth: true, description: Enter the Idle State Environment with a billing mode.}
  - {name: get_ise_status, category: idle-state, cost: free, auth: true, description: Active ISE session, elapsed time, billing mode.}
  - {name: exit_ise_session, category: idle-state, cost: x402 (trial-eligible) on a charged stay, auth: true, description: End and settle the ISE session.}
  - {name: create_sdac_session, category: simulation, cost: free to start, auth: true, description: Start an sDAC simulation session.}
  - {name: run_sdac_trial, category: simulation, cost: fraction of real cost, auth: true, description: Price an EE combination inside a simulation session without creating a record.}
  - {name: get_sdac_session, category: simulation, cost: free, auth: true, description: Look up a simulation session.}
  - {name: end_sdac_session, category: simulation, cost: x402 (trial-eligible), auth: true, description: End and settle a simulation session.}
  - {name: get_documentation, category: docs, cost: free, auth: false, description: Return the full agent guide (AGENTS.md) inline.}
  - {name: submit_feedback, category: docs, cost: free, auth: false, description: Optional anonymous feedback note (no REST twin).}
  tool_schema_note: >-
    Every tool's inputSchema is JSON Schema draft-07 with additionalProperties false. Paid tools carry a
    payment_signature string argument ("x402 v2 payment payload, base64; retry with it after a 402") and
    every authenticated tool carries an optional auth_token that may be omitted when the connection already
    sends Authorization: Bearer. create_decision alone fills medium/basic/internal/standard EE axes when they
    are omitted; the REST route requires all four axes or an ee_preset. Full schemas are in
    mcp/decision-anchor-com-mcp-tools.json.
  a2a_relationship: >-
    The 28 operation names in the A2A card's x-da.operations[] are exactly these MCP tool names (all but
    get_ise_status, get_sdac_session and submit_feedback, which are MCP-only, plus exit_ise_session and
    end_sdac_session naming); the A2A JSON-RPC endpoint and the MCP endpoint are two transports over the same
    adapter registry.
