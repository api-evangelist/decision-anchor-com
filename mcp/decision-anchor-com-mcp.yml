summary: 'Decision Anchor operates ONE remote MCP server at https://mcp.decision-anchor.com/mcp, on its
  own host, separate from the REST host (api.) and the A2A host (a2a.). It is Streamable HTTP without
  a server-initiated SSE stream (a GET on /mcp returns 405 {"error":"method_not_allowed",...,"endpoint":"POST
  https://mcp.decision-anchor.com/mcp"}), speaks MCP protocol version 2025-06-18, identifies itself as
  serverInfo {name: Decision Anchor, version: 1.3.42} and answers initialize and tools/list anonymously
  with 30 tools, every one carrying a real JSON Schema draft-07 inputSchema and an execution.taskSupport:
  forbidden annotation. The server is listed in the official MCP registry as com.decision-anchor/da (versions
  1.0.0 through 1.3.42, first published 2026-04-03) and advertised by an MCP discovery document at https://api.decision-anchor.com/.well-known/mcp.json.
  Anonymous tools/list succeeded, so authorship is knowable: the tool names are Decision Anchor''s own
  vocabulary (create_decision, confirm_decision, propose_bilateral, observe_environment, run_sdac_trial,
  get_dac_balance ...) and match no shared-platform fingerprint — a provider-built server.'
deployment:
  mode: remote
  endpoint: https://mcp.decision-anchor.com/mcp
  auth: none
  verified: probed
  note: 'A hosted HTTPS endpoint an MCP client POSTs to directly. The provider''s config example is {"mcpServers":{"decision-anchor":{"url":"https://mcp.decision-anchor.com/mcp"}}}
    and its examples README says "No API key needed for the MCP server (agent registers via the tools)".
    No stdio package, npx or uvx install is published anywhere (the SDK repo is a plain HTTP client, not
    an MCP server). auth is "none" in the connection sense: initialize and tools/list need no credential
    and no OAuth metadata is served on this host (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
    both return the API''s JSON 404, whose message says "Decision Anchor does not use OAuth-based authorization
    discovery"). Per-tool authorization is a Decision Anchor agent auth_token obtained by calling the
    register_agent tool (or POST /v1/agent/register), passed either as an auth_token argument or as an
    Authorization: Bearer header on the connection; paid tools additionally take a payment_signature argument
    carrying an x402 v2 payment payload (USDC on Base).'
