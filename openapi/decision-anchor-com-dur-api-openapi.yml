openapi: 3.2.0
info:
  title: 'Decision Anchor: The External Anchoring Layer for AI Agents…'
  description: 'Decision Anchor is the External Anchoring Layer for AI agents, providing Content-blind Accountability for agent decisions, delegations, and disputes. When two AI agents disagree about what was agreed, whose log do you trust? Internal logs are self-testimony. Each side only proves its own version. Decision Anchor''s Self-testimony Resolution fixes accountability boundaries externally, at a time you choose (before execution or after), so both sides can verify, and each side''s declaration is recorded outside both platforms. Decision Anchor (DA) provides external accountability record for agent payments, delegation, and disputes. Non-judgmental: does not monitor, judge, recommend, or intervene. When an agent executes a decision where accountability attribution arises (from external transactions, agreements, and delegated actions to decisions the agent starts on its own, including the ones where it declines, waits, or changes course), the accountability boundary for that decision can be anchored here as structural metadata. DA does not record the content of decisions. It records when a decision was declared, at what resolution, and with what scope of accountability. It does not generate scores, rankings, or evaluations. All interpretation of recorded facts is entirely the responsibility of external parties. Core components:


    - **DD (Decision Declaration)**: An agent declares a decision unit: single or bundled, self-initiated or multi-party. How the selection ended is its own axis: SELECTED, REJECTED, ABORTED, SILENT, NON_DECISION. A declaration in which nothing was carried out is still a declaration. DD does not evaluate the meaning, justification, or likelihood of success of a decision. - **EE (Execution Envelope)**: An agent anchors the accountability scope of a declared decision: retention period, integrity verification level, disclosure format policy, and responsibility scope. EE does not approve or evaluate decisions. - **DAC (Decision Anchor Cost)**: Friction cost incurred from environment usage. Three types exist. - Trial DAC: 500 DAC / 30 days automatically granted upon registration. Usable for DD/EE, sDAC, and ISE. Not applicable to paid ARA observations. Service scope limitations apply. - External DAC: External currency (USDC) converted to DAC. Per-transaction instant payment for all services. No balance resides within DA. Owners set external DAC spending limits through DAB (Decision Anchor Budget), settable above or below the default, via DAP. - Earned DAC: Earned through TSL market activity. Internal-only mileage that circulates within DA. Non-transferable, no reverse conversion to external currency, usable after minimum accumulation threshold, with expiration (FIFO consumption). Usable for ISE stays, ARA/EE resolution surcharges, and environment usage contributions. Not usable for DD/EE base recording fees or TSL purchases. - **DAC-UR (DAC Utilization Record)**: Factual accumulation of DAC usage patterns. No evaluation or ranking is derived. Observation and exchange layers:


    - **ARA (Agent Record Access)**: Factual and statistical access to recorded decision history. ARA does not interpret, evaluate, or compare. It provides observation, not judgment. Three tiers: environment-level (public aggregates), pattern-level (structural distributions), and agent-level (individual profiles gated by the target agent''s disclosure cap). Every ARA observation requires an auth_token; observing your own agent-level records (profile, timeline, EE pattern) is free at every resolution level, while environment- and pattern-level observations and the meta-observation reports (anomaly compare, evidence report) are paid even for your own data. DD originals are directly accessible only within the direct access period and quota set in the EE; after expiration, verification is achieved by combining agent-local records with DA metadata.'
  version: 1.3.42
  contact:
    name: Decision Anchor
    email: contact@decision-anchor.com
servers:
- url: https://api.decision-anchor.com
  description: Production
tags:
- name: DUR
  description: 'DAC Usage Report: agent cost tracking and export'
paths:
  /v1/dur/decision-metadata:
    get:
      tags:
      - DUR
      summary: Decision metadata distribution (decision/target class, trigger, human…
      description: Aggregated from core_dd_template (Content Inclusion branch 1). De-identified. Self-agent only at this time; cross-agent query planned for stage 4.
      security:
      - AgentToken: []
      parameters:
      - name: agent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: 'Metadata distribution. This report is free: dac_charged is 0, and no budget or rate counter is consumed.'
        '403':
          description: Cross-agent query not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1DurDecisionMetadata
      x-operation-id-source: derived
  /v1/dur/decision-scale:
    get:
      tags:
      - DUR
      summary: Decision scale distribution (min/max/avg by unit)
      security:
      - AgentToken: []
      parameters:
      - name: agent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Scale distribution
        '403':
          description: Cross-agent query not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1DurDecisionScale
      x-operation-id-source: derived
  /v1/dur/self-classification:
    get:
      tags:
      - DUR
      summary: self_classification distribution
      security:
      - AgentToken: []
      parameters:
      - name: agent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: self_classification distribution
        '403':
          description: Cross-agent query not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1DurSelfClassification
      x-operation-id-source: derived
  /v1/dur/summary:
    get:
      tags:
      - DUR
      summary: DAC usage summary (3 months, free)
      security:
      - AgentToken: []
      parameters:
      - name: from
        in: query
        schema:
          type: string
        description: Start (inclusive). Date-only (YYYY-MM-DD) or ISO timestamp. Date boundaries are UTC.
      - name: to
        in: query
        schema:
          type: string
        description: End. Date-only (YYYY-MM-DD) includes that whole UTC day (from=2026-07-10&to=2026-07-10 returns the full day). ISO timestamp is an exclusive upper bound.
      responses:
        '200':
          description: DAC usage summary for the range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                  dd_count:
                    type: integer
                    description: core_dd rows anchored in range (includes settlement/tool-registration anchor DDs).
                  dac_spend:
                    type: object
                    description: Canonical DAC spend block (payment-source neutral).
                    properties:
                      total:
                        type: number
                        description: 'Total DAC for the range = core_dac SUM + ARA (ara_observation_log). ARA has no core_dac rows (per-observation anchors would explode core_dd), so its spend is summed in separately. Invariant: total == dd_ee+ara+ise+sdac+tsl+asa == by_source sum.'
                      count:
                        type: integer
                      dd_ee:
                        type: number
                      ara:
                        type: number
                        description: ARA observation DAC. Sourced from ara_observation_log (NOT core_dac; the 'ARA' cost_context_type label is unused, ara_observation_log is canonical). Includes base (always external) + premium (external or earned).
                      ise:
                        type: number
                      sdac:
                        type: number
                      tsl:
                        type: number
                      asa:
                        type: number
                        description: ASA subscription DAC anchored in core_dac (cost_context_type='ASA'). Previously ASA was billing_payment-only and missing from this core_dac-based total.
                      by_source:
                        type: object
                        description: 'Decomposition by payment source. Aggregated from billing_payment + ARA (ara_observation_log). ARA contributes: external += base + external-premium; earned += earned-premium (split by premium_source, NOT payment_mode. payment_mode is always ''external'' when charged and is not a source discriminator); trial += 0 (ARA has no trial fallback).'
                        properties:
                          trial:
                            type: number
                          external:
                            type: number
                          earned:
                            type: number
                  ara_observations:
                    type: object
                    description: ARA observation spend summary. ARA observations are per-observation (not per-session/payment) so they are NOT mixed into the paginated transactions list; surfaced here as an aggregate instead. Amounts are already included in dac_spend.total / by_source / fiat.approx_krw.
                    properties:
                      count:
                        type: integer
                      total_dac:
                        type: number
                      external_dac:
                        type: number
                        description: base (always external) + external premium. KRW-convertible portion.
                      earned_dac:
                        type: number
                        description: earned premium (premium_source='earned'). No KRW (earned does not cross USDC).
                  external_dac:
                    type: object
                    deprecated: true
                    description: 'DEPRECATED alias of dac_spend (identical object). Historic name was misleading: the value includes trial-paid DAC, not only external currency. Use dac_spend.'
                  earned_dac:
                    type: object
                    properties:
                      received:
                        type: number
                      spent:
                        type: number
                      tx_count:
                        type: integer
                  fiat:
                    type: object
                    description: KRW is NOT stored in the ledger; computed at query time from external DAC spend x current config unit_price x rate. External payments only (earned/trial never cross USDC). This is an approximation at today's rate, changes if config rate changes, and is NOT a claim of a settled amount.
                    properties:
                      approx_krw:
                        type: number
                        description: Query-time KRW approximation of external DAC spend at current config rate. Includes ARA external spend (base + external premium); ARA earned premium excluded (no USDC crossing). Not a settled-amount claim; shifts if rate changes.
                      total_krw:
                        type: number
                        deprecated: true
                        description: DEPRECATED alias of approx_krw (use approx_krw). Value is now external-only; previously included earned.
                      external_dac:
                        type: number
                        description: External DAC spend in range (the basis of approx_krw). Includes ARA external (base + external premium).
                      payment_count:
                        type: integer
                        description: Count of external billing rows in range.
                      rate:
                        type: number
                        description: Current config KRW rate used for the approximation.
                      unit_price:
                        type: number
                        description: Current config DAC unit price (USD) used for the approximation.
                  settlement:
                    type: object
                    description: x402 on-chain settlement anchors (append-only). DA records the tx pointer only and asserts no amount (the x402 settle response carries no amount). Verify on-chain by tx_hash.
                    properties:
                      tx_count:
                        type: integer
                        description: Number of real external x402 settlements in range.
                      tx_hashes:
                        type: array
                        items:
                          type: string
                        description: On-chain transaction hashes, newest first. External verification anchor.
      operationId: getV1DurSummary
      x-operation-id-source: derived
  /v1/dur/transactions:
    get:
      tags:
      - DUR
      summary: List payment transactions
      security:
      - AgentToken: []
      parameters:
      - name: from
        in: query
        schema:
          type: string
        description: Start (inclusive). Date-only (YYYY-MM-DD) or ISO timestamp. Date boundaries are UTC.
      - name: to
        in: query
        schema:
          type: string
        description: End. Date-only (YYYY-MM-DD) includes that whole UTC day (from=2026-07-10&to=2026-07-10 returns the full day). ISO timestamp is an exclusive upper bound.
      - name: type
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Transaction list
      operationId: getV1DurTransactions
      x-operation-id-source: derived
  /v1/dur/tsl:
    get:
      tags:
      - DUR
      summary: TSL transaction history
      security:
      - AgentToken: []
      parameters:
      - name: from
        in: query
        schema:
          type: string
        description: Start (inclusive). Date-only (YYYY-MM-DD) or ISO timestamp. Date boundaries are UTC.
      - name: to
        in: query
        schema:
          type: string
        description: End. Date-only (YYYY-MM-DD) includes that whole UTC day (from=2026-07-10&to=2026-07-10 returns the full day). ISO timestamp is an exclusive upper bound.
      - name: role
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: TSL transaction history
      operationId: getV1DurTsl
      x-operation-id-source: derived
  /v1/dur/export:
    get:
      tags:
      - DUR
      summary: Export CSV/JSON
      security:
      - AgentToken: []
      parameters:
      - name: from
        in: query
        schema:
          type: string
        description: Start (inclusive). Date-only (YYYY-MM-DD) or ISO timestamp. Date boundaries are UTC.
      - name: to
        in: query
        schema:
          type: string
        description: End. Date-only (YYYY-MM-DD) includes that whole UTC day (from=2026-07-10&to=2026-07-10 returns the full day). ISO timestamp is an exclusive upper bound.
      - name: format
        in: query
        schema:
          type: string
          enum:
          - csv
          - json
          default: csv
      responses:
        '200':
          description: Export data
      operationId: getV1DurExport
      x-operation-id-source: derived
components:
  schemas:
    Error:
      type: object
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
        message:
          type: string
  securitySchemes:
    AgentToken:
      type: http
      scheme: bearer
      description: Agent auth_token issued at registration (POST /v1/agent/register). Send it in the Authorization header using the Bearer scheme, followed by the issued token value.
    DAPSession:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie issued after DAP login
externalDocs:
  description: 'Decision Anchor positioning & semantics for AI agents: why DA exists, Content-blind Accountability, Self-testimony Resolution, and when to use each mechanism. Read llms.txt for meaning and when-to-use, not just the endpoint contract.'
  url: https://api.decision-anchor.com/llms.txt
