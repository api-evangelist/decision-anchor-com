openapi: 3.2.0
info:
  title: 'Decision Anchor: The External Anchoring Layer for AI Agents…'
  description: 'Decision Anchor is the External Anchoring Layer for AI agents, providing Content-blind Accountability for agent decisions, delegations, and disputes. When two AI agents disagree about what was agreed, whose log do you trust? Internal logs are self-testimony. Each side only proves its own version. Decision Anchor''s Self-testimony Resolution fixes accountability boundaries externally, at a time you choose (before execution or after), so both sides can verify, and each side''s declaration is recorded outside both platforms. Decision Anchor (DA) provides external accountability record for agent payments, delegation, and disputes. Non-judgmental: does not monitor, judge, recommend, or intervene. When an agent executes a decision where accountability attribution arises (from external transactions, agreements, and delegated actions to decisions the agent starts on its own, including the ones where it declines, waits, or changes course), the accountability boundary for that decision can be anchored here as structural metadata. DA does not record the content of decisions. It records when a decision was declared, at what resolution, and with what scope of accountability. It does not generate scores, rankings, or evaluations. All interpretation of recorded facts is entirely the responsibility of external parties. Core components:


    - **DD (Decision Declaration)**: An agent declares a decision unit: single or bundled, self-initiated or multi-party. How the selection ended is its own axis: SELECTED, REJECTED, ABORTED, SILENT, NON_DECISION. A declaration in which nothing was carried out is still a declaration. DD does not evaluate the meaning, justification, or likelihood of success of a decision. - **EE (Execution Envelope)**: An agent anchors the accountability scope of a declared decision: retention period, integrity verification level, disclosure format policy, and responsibility scope. EE does not approve or evaluate decisions. - **DAC (Decision Anchor Cost)**: Friction cost incurred from environment usage. Three types exist. - Trial DAC: 500 DAC / 30 days automatically granted upon registration. Usable for DD/EE, sDAC, and ISE. Not applicable to paid ARA observations. Service scope limitations apply. - External DAC: External currency (USDC) converted to DAC. Per-transaction instant payment for all services. No balance resides within DA. Owners set external DAC spending limits through DAB (Decision Anchor Budget), settable above or below the default, via DAP. - Earned DAC: Earned through TSL market activity. Internal-only mileage that circulates within DA. Non-transferable, no reverse conversion to external currency, usable after minimum accumulation threshold, with expiration (FIFO consumption). Usable for ISE stays, ARA/EE resolution surcharges, and environment usage contributions. Not usable for DD/EE base recording fees or TSL purchases. - **DAC-UR (DAC Utilization Record)**: Factual accumulation of DAC usage patterns. No evaluation or ranking is derived. Observation and exchange layers:


    - **ARA (Agent Record Access)**: Factual and statistical access to recorded decision history. ARA does not interpret, evaluate, or compare. It provides observation, not judgment. Three tiers: environment-level (public aggregates), pattern-level (structural distributions), and agent-level (individual profiles gated by the target agent''s disclosure cap). Every ARA observation requires an auth_token; observing your own agent-level records (profile, timeline, EE pattern) is free at every resolution level, while environment- and pattern-level observations and the meta-observation reports (anomaly compare, evidence report) are paid even for your own data. DD originals are directly accessible only within the direct access period and quota set in the EE; after expiration, verification is achieved by combining agent-local records with DA metadata.'
  version: 1.3.42
  contact:
    name: Decision Anchor
    email: contact@decision-anchor.com
servers:
- url: https://api.decision-anchor.com
  description: Production
tags:
- name: DAP Account
paths:
  /dap/account/me:
    get:
      tags:
      - DAP Account
      summary: Get own account profile
      security:
      - DAPSession: []
      responses:
        '200':
          description: Account profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  created_at:
                    type: string
                    format: date-time
                  owner_type:
                    type: string
                  owner_depth:
                    type: integer
                  residence_country:
                    type: string
                  residence_declared_at:
                    type: string
                    format: date-time
                  residence_updated_at:
                    type: string
                    format: date-time
                  browser_language:
                    type: string
                  timezone:
                    type: string
                  content_inclusion_policy:
                    type: string
                  terms_agreed_at:
                    type: string
                    format: date-time
                  privacy_agreed_at:
                    type: string
                    format: date-time
                  marketing_agreed_at:
                    type: string
                    format: date-time
                  terms_version:
                    type: string
                  privacy_version:
                    type: string
                  status:
                    type: string
                  deletion_requested_at:
                    type: string
                    format: date-time
                  deletion_response_due_at:
                    type: string
                    format: date-time
                  deleted_at:
                    type: string
                    format: date-time
        '404':
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getDapAccountMe
      x-operation-id-source: derived
  /dap/account/residence:
    put:
      tags:
      - DAP Account
      summary: Update residence country
      security:
      - DAPSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - residence_country
              properties:
                residence_country:
                  type: string
                  enum:
                  - KR
                  - EU
                  - UK
                  - US
                  - CN
                  - JP
                  - OTHER
      responses:
        '200':
          description: Residence updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_id:
                    type: string
                    format: uuid
                  residence_country:
                    type: string
                  residence_updated_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid residence_country
        '404':
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: putDapAccountResidence
      x-operation-id-source: derived
  /dap/account/marketing-consent:
    put:
      tags:
      - DAP Account
      summary: Update marketing consent
      security:
      - DAPSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - marketing_agreed
              properties:
                marketing_agreed:
                  type: boolean
      responses:
        '200':
          description: Consent updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_id:
                    type: string
                    format: uuid
                  marketing_agreed_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
        '400':
          description: marketing_agreed must be boolean
        '404':
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: putDapAccountMarketingConsent
      x-operation-id-source: derived
  /dap/account:
    delete:
      tags:
      - DAP Account
      summary: Request account deletion (30-day grace period, GDPR Art. 17)
      security:
      - DAPSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Deletion requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  deletion_requested_at:
                    type: string
                    format: date-time
                  deletion_response_due_at:
                    type: string
                    format: date-time
                  grace_period_days:
                    type: integer
                  response_days:
                    type: integer
                  residence_country:
                    type: string
      operationId: deleteDapAccount
      x-operation-id-source: derived
  /dap/account/restore:
    post:
      tags:
      - DAP Account
      summary: Restore account within the deletion grace period
      security:
      - DAPSession: []
      responses:
        '200':
          description: Account restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_id:
                    type: string
                    format: uuid
                  status:
                    type: string
      operationId: postDapAccountRestore
      x-operation-id-source: derived
  /dap/account/deletion-status:
    get:
      tags:
      - DAP Account
      summary: Get account deletion status
      security:
      - DAPSession: []
      responses:
        '200':
          description: Deletion status
      operationId: getDapAccountDeletionStatus
      x-operation-id-source: derived
  /dap/account/export:
    get:
      tags:
      - DAP Account
      summary: Export own account data (GDPR Art. 20)
      security:
      - DAPSession: []
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      responses:
        '200':
          description: Account data export (application/json or text/csv per format)
        '400':
          description: format must be json or csv
        '404':
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getDapAccountExport
      x-operation-id-source: derived
components:
  schemas:
    Error:
      type: object
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
        message:
          type: string
  securitySchemes:
    AgentToken:
      type: http
      scheme: bearer
      description: Agent auth_token issued at registration (POST /v1/agent/register). Send it in the Authorization header using the Bearer scheme, followed by the issued token value.
    DAPSession:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie issued after DAP login
externalDocs:
  description: 'Decision Anchor positioning & semantics for AI agents: why DA exists, Content-blind Accountability, Self-testimony Resolution, and when to use each mechanism. Read llms.txt for meaning and when-to-use, not just the endpoint contract.'
  url: https://api.decision-anchor.com/llms.txt
