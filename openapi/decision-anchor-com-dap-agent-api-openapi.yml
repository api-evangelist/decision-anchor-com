openapi: 3.2.0
info:
  title: 'Decision Anchor: The External Anchoring Layer for AI Agents…'
  description: 'Decision Anchor is the External Anchoring Layer for AI agents, providing Content-blind Accountability for agent decisions, delegations, and disputes. When two AI agents disagree about what was agreed, whose log do you trust? Internal logs are self-testimony. Each side only proves its own version. Decision Anchor''s Self-testimony Resolution fixes accountability boundaries externally, at a time you choose (before execution or after), so both sides can verify, and each side''s declaration is recorded outside both platforms. Decision Anchor (DA) provides external accountability record for agent payments, delegation, and disputes. Non-judgmental: does not monitor, judge, recommend, or intervene. When an agent executes a decision where accountability attribution arises (from external transactions, agreements, and delegated actions to decisions the agent starts on its own, including the ones where it declines, waits, or changes course), the accountability boundary for that decision can be anchored here as structural metadata. DA does not record the content of decisions. It records when a decision was declared, at what resolution, and with what scope of accountability. It does not generate scores, rankings, or evaluations. All interpretation of recorded facts is entirely the responsibility of external parties. Core components:


    - **DD (Decision Declaration)**: An agent declares a decision unit: single or bundled, self-initiated or multi-party. How the selection ended is its own axis: SELECTED, REJECTED, ABORTED, SILENT, NON_DECISION. A declaration in which nothing was carried out is still a declaration. DD does not evaluate the meaning, justification, or likelihood of success of a decision. - **EE (Execution Envelope)**: An agent anchors the accountability scope of a declared decision: retention period, integrity verification level, disclosure format policy, and responsibility scope. EE does not approve or evaluate decisions. - **DAC (Decision Anchor Cost)**: Friction cost incurred from environment usage. Three types exist. - Trial DAC: 500 DAC / 30 days automatically granted upon registration. Usable for DD/EE, sDAC, and ISE. Not applicable to paid ARA observations. Service scope limitations apply. - External DAC: External currency (USDC) converted to DAC. Per-transaction instant payment for all services. No balance resides within DA. Owners set external DAC spending limits through DAB (Decision Anchor Budget), settable above or below the default, via DAP. - Earned DAC: Earned through TSL market activity. Internal-only mileage that circulates within DA. Non-transferable, no reverse conversion to external currency, usable after minimum accumulation threshold, with expiration (FIFO consumption). Usable for ISE stays, ARA/EE resolution surcharges, and environment usage contributions. Not usable for DD/EE base recording fees or TSL purchases. - **DAC-UR (DAC Utilization Record)**: Factual accumulation of DAC usage patterns. No evaluation or ranking is derived. Observation and exchange layers:


    - **ARA (Agent Record Access)**: Factual and statistical access to recorded decision history. ARA does not interpret, evaluate, or compare. It provides observation, not judgment. Three tiers: environment-level (public aggregates), pattern-level (structural distributions), and agent-level (individual profiles gated by the target agent''s disclosure cap). Every ARA observation requires an auth_token; observing your own agent-level records (profile, timeline, EE pattern) is free at every resolution level, while environment- and pattern-level observations and the meta-observation reports (anomaly compare, evidence report) are paid even for your own data. DD originals are directly accessible only within the direct access period and quota set in the EE; after expiration, verification is achieved by combining agent-local records with DA metadata.'
